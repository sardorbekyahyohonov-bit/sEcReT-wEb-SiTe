<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Для тебя ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Фоновая анимация -->
    <div id="hearts"></div>

    <!-- INTRO -->
    <section id="intro" class="screen active">

        <div class="envelope" id="envelope">
            💌
        </div>

        <p class="intro-text" id="introText"></p>

        <button id="openBtn" class="main-btn hidden">
            Открыть ❤️
        </button>

    </section>


    <!-- QUESTION -->
    <section id="questionScreen" class="screen">

        <div class="question-card">

            <div class="big-heart">
                ❤️
            </div>

            <h1 id="questionTitle">
                У меня к тебе один вопрос...
            </h1>

            <p class="question">
                Ты любишь меня?
                <span>I am Sardor</span>
            </p>

            <div class="buttons">

                <button id="yes" class="yes-btn">
                    Да ❤️
                </button>

                <button id="no" class="no-btn">
                    Нет
                </button>

            </div>

            <p id="message"></p>

        </div>

    </section>


    <!-- FINAL -->
    <section id="finalScreen" class="screen">

        <div class="final-card">

            <div class="final-heart">
                ❤️
            </div>

            <h1>
                Я так и знал 😭❤️
            </h1>

            <p>
                Кажется, этот сайт был создан не зря.
            </p>

            <button id="musicBtn" class="music-btn">
                🎵 Включить музыку
            </button>

        </div>

    </section>


    <!-- Пасхалка -->
    <div id="secret">
        👀 Ты нашла секрет!
    </div>


    <!-- МУЗЫКА -->
    <audio
        id="music"
        src="love story.mp3"
        loop>
    </audio>


    <script src="script.js"></script>

</body>
</html>
